# Solo desarrollo: crea una instancia independiente. No reutilizar volúmenes de otras bases.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: kiments_db
      POSTGRES_USER: ${DB_USERNAME:?Configure DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d kiments_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  auth_pgdata:
