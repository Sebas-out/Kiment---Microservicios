name: Desplegar Catálogo e Inventario en Docker

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Rama a compilar (sin necesidad de mergear a main)"
        required: true
        default: "kiments-catalog-inventory-service"

concurrency:
  group: kiments-catalog-aca-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: kiments-catalog-aca

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Construir la imagen de Catálogo e Inventario
        id: build
        run: |
          : "${ACR_NAME:?Falta la variable ACR_NAME en GitHub}"
          : "${AZURE_RESOURCE_GROUP:?Falta la variable AZURE_RESOURCE_GROUP en GitHub}"

          if [ -f "backend/kiments-catalog-inventory-service/Dockerfile" ]; then
            BUILD_CTX="backend/kiments-catalog-inventory-service"
            DOCKERFILE="backend/kiments-catalog-inventory-service/Dockerfile"
          else
            BUILD_CTX="."
            DOCKERFILE="Dockerfile"
          fi

          TAG="$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          docker build --platform linux/amd64 \
            --file "$DOCKERFILE" \
            --tag "kiments-catalog-inventory-service:$TAG" \
            "$BUILD_CTX"

      - name: Iniciar sesión en Azure con OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D13F4267B6D74B03B26C53FE92C3E115 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BF4D988F5DAF436BB949696B87CD1B0B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7A4BD622393745D1A68FDF76166D6881 }}

      - name: Publicar la imagen y actualizar Container Apps
        run: |
          TAG="${{ steps.build.outputs.tag }}"
          registry="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          : "${registry:?Azure no devolvió el servidor del registro}"
          image="$registry/kiments-catalog-inventory-service:$TAG"

          az acr login --name "$ACR_NAME"
          docker tag "kiments-catalog-inventory-service:$TAG" "$image"
          docker push "$image"

          if az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME" >/dev/null 2>&1; then
            az containerapp update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$APP_NAME" \
              --image "$image" \
              --query properties.latestRevisionName \
              --output tsv
          else
            echo "Imagen publicada correctamente: $image"
            echo "Ahora crea el Container App '$APP_NAME' en Azure Portal eligiendo esta imagen."
          fi
